<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Doolhofmachine</title><style>body{margin:0;background:#101923;color:#f2f5f7;font-family:system-ui;text-align:center}h1{font-size:1.5rem;margin:14px}main{max-width:850px;margin:auto;padding:0 12px}canvas{display:block;width:min(94vw,75vh,750px);height:auto;margin:12px auto;background:#fff;touch-action:none;border-radius:6px}button{border:0;border-radius:12px;background:#294a62;color:white;padding:13px 18px;font-size:19px;touch-action:none;user-select:none}button:active{background:#4c91b8}.controls{display:grid;grid-template-columns:repeat(3,65px);gap:7px;justify-content:center;margin:12px}.controls button{padding:12px 0;font-size:25px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.bar{display:flex;justify-content:center;gap:16px;align-items:center;flex-wrap:wrap}#status{min-height:25px;color:#b9e6c5}</style></head><body><main><h1>DOOLHOFMACHINE</h1><div class="bar"><button id="new">Nieuw doolhof</button><span id="clock">Tijd: 0:00</span></div><canvas id="maze" width="1000" height="1000"></canvas><div id="status">Vind de groene uitgang!</div><div class="controls"><button class="up" data-dir="0,-1">▲</button><button class="left" data-dir="-1,0">◀</button><button class="down" data-dir="0,1">▼</button><button class="right" data-dir="1,0">▶</button></div></main><script>
(()=>{'use strict';const N=20,S=50,c=document.querySelector('#maze'),ctx=c.getContext('2d'),clock=document.querySelector('#clock'),status=document.querySelector('#status');let cells,px,py,goal,started,elapsed,won=false,held=null,last=0,acc=0;const dirs=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];function idx(x,y){return y*N+x}function generate(){cells=Array.from({length:N*N},()=>({walls:15,seen:false}));let stack=[idx(0,0)];cells[0].seen=true;while(stack.length){let cur=stack[stack.length-1],x=cur%N,y=Math.floor(cur/N);let options=dirs.map(([dx,dy,bit,opp])=>({nx:x+dx,ny:y+dy,bit,opp})).filter(a=>a.nx>=0&&a.nx<N&&a.ny>=0&&a.ny<N&&!cells[idx(a.nx,a.ny)].seen);if(!options.length){stack.pop();continue}let a=options[Math.floor(Math.random()*options.length)],next=idx(a.nx,a.ny);cells[cur].walls&=~a.bit;cells[next].walls&=~a.opp;cells[next].seen=true;stack.push(next)}cells[0].walls&=~8;cells[N*N-1].walls&=~2;px=0;py=0;goal=idx(N-1,N-1);started=0;elapsed=0;won=false;held=null;acc=0;status.textContent='Vind de groene uitgang!';clock.textContent='Tijd: 0:00';draw()}function draw(){ctx.fillStyle='#f6f8f8';ctx.fillRect(0,0,1000,1000);ctx.fillStyle='#c9f1d4';ctx.fillRect(950,950,50,50);ctx.strokeStyle='#192d3d';ctx.lineWidth=5;ctx.lineCap='square';ctx.beginPath();for(let y=0;y<N;y++)for(let x=0;x<N;x++){let w=cells[idx(x,y)].walls,X=x*S,Y=y*S;if(w&1){ctx.moveTo(X,Y);ctx.lineTo(X+S,Y)}if(w&8){ctx.moveTo(X,Y);ctx.lineTo(X,Y+S)}if(y===N-1&&(w&4)){ctx.moveTo(X,Y+S);ctx.lineTo(X+S,Y+S)}if(x===N-1&&(w&2)){ctx.moveTo(X+S,Y);ctx.lineTo(X+S,Y+S)}}ctx.stroke();ctx.fillStyle='#17a85e';ctx.font='bold 24px system-ui';ctx.fillText('UIT',953,980);ctx.beginPath();ctx.arc(px*S+S/2,py*S+S/2,16,0,Math.PI*2);ctx.fillStyle='#e75b38';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}function move(dx,dy){if(won)return;let d=dirs.find(d=>d[0]===dx&&d[1]===dy);if(!d)return;if(cells[idx(px,py)].walls&d[2])return;if(!started)started=performance.now();px+=dx;py+=dy;draw();if(idx(px,py)===goal){won=true;elapsed=(performance.now()-started)/1000;status.textContent='🎉 Uitgang bereikt! Tijd: '+fmt(elapsed)}}function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function tick(t){if(started&&!won)clock.textContent='Tijd: '+fmt((t-started)/1000);if(held&&!won){if(!last)last=t;acc+=Math.min(t-last,100);if(acc>125){move(...held);acc=0}}last=t;requestAnimationFrame(tick)}document.querySelector('#new').addEventListener('click',generate);document.querySelectorAll('[data-dir]').forEach(b=>{let dir=b.dataset.dir.split(',').map(Number);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held=dir;acc=0;move(...dir)});for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>{held=null;acc=0})});const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};document.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();if(!e.repeat)move(...keys[e.key]);held=keys[e.key]}});document.addEventListener('keyup',e=>{if(keys[e.key]){held=null;acc=0}});generate();requestAnimationFrame(tick)})();
</script></body></html>
